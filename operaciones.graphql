# Unidad II · Actividad 5 · Operaciones reproducibles
# Desde la actividad 6, todas las operaciones protegidas toman a la persona del
# token: haz login y pon en Headers  { "Authorization": "Bearer TOKEN" }.
# Cada operación tiene nombre. Sus variables están en variables/*.json
# (la tabla del README dice cuál corresponde a cada una).
# En GraphiQL: pega este archivo, pon el JSON en el panel Variables
# y elige con el botón ▶ la operación que quieres ejecutar.

fragment DatosPermiso on Permission {
  id
  code
  name
}

# E01 · sin variables (o ninguna)
query ConsultarRoles {
  roles {
    id
    code
    name
    isActive
  }
}

# E01 · sin variables
query ConsultarPermisos {
  permissions {
    ...DatosPermiso
    isActive
  }
}

# E01 · variables/capturista.json
query ListaDeCapturista($roleId: ID!) {
  rolePermissions(roleId: $roleId) {
    id
    isActive
    permission {
      ...DatosPermiso
    }
  }
}

# E02 · sin variables (alias + fragmento + variable)
query ExplorarCatalogo {
  cuentas: permissionCatalog(resource: ACCOUNTS) {
    ...DatosPermiso
  }
  movimientos: permissionCatalog(resource: TRANSACTIONS) {
    ...DatosPermiso
  }
}

# E02 · sin variables (sin filtro: los diez permisos activos)
query CatalogoCompleto {
  permissionCatalog {
    ...DatosPermiso
  }
}

# E03 y E06 · variables/s1_capturista.json o variables/e06_*.json
query RevisarConfiguracion($input: SetRolePermissionsInput!) {
  previewRolePermissions(input: $input) {
    role {
      code
    }
    current {
      code
    }
    toActivate {
      code
    }
    toDeactivate {
      code
    }
    unchanged {
      code
    }
    finalCount
  }
}

# E04, E05, E06, E08 y E09 · variables/s0_capturista.json, s1_capturista.json,
# vacia_capturista.json o e06_*.json
mutation AplicarConfiguracion($input: SetRolePermissionsInput!) {
  setRolePermissions(input: $input) {
    role {
      code
    }
    activated {
      code
    }
    deactivated {
      code
    }
    unchanged {
      code
    }
    finalCount
    changed
  }
}

# E10 · variables/e10_consultar_cuentas.json
query ConsultarCuentas($companyId: ID!) {
  accounts(companyId: $companyId) {
    id
    name
    accountType
    isActive
  }
}

# E10 · variables/e10_registrar_movimiento.json

mutation RegistrarMovimiento($accountId: ID!, $conceptId: ID!, $amount: Decimal!) {
  createTransaction(
    input: {
      accountId: $accountId
      conceptId: $conceptId
      transactionType: INCOME
      amount: $amount
      shortDescription: "Prueba de continuidad E10"
    }
  ) {
    id
    amount
    transactionType
    account {
      name
    }
    concept {
      name
    }
  }
}
